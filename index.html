<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swemun AI - Your Personal AI Assistant</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Design */
    .header {
      background: #1e293b;
      padding: 15px 20px;
      border-bottom: 1px solid #334155;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header span {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Chat Area */
    .chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Welcome Screen */
    .welcome-screen {
      text-align: center;
      margin: auto;
      max-width: 400px;
    }

    .welcome-screen h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    .welcome-screen p {
      color: #94a3b8;
      font-size: 15px;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      margin-left: auto;
      background: #3b82f6;
      color: white;
      padding: 12px 16px;
      border-radius: 18px 18px 0 18px;
      word-break: break-word;
    }

    .message.ai {
      margin-right: auto;
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 18px 18px 18px 0;
      border: 1px solid #334155;
      word-break: break-word;
    }

    /* Input Area */
    .input-section {
      background: #1e293b;
      padding: 15px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    .input-section input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px 18px;
      border-radius: 30px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .input-section input:focus {
      border-color: #3b82f6;
    }

    .input-section button {
      background: #3b82f6;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .input-section button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="header">
    🤖 <span>Swemun AI</span>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="welcome-screen" id="welcomeScreen">
      <h1>Hello, I'm Swemun AI</h1>
      <p>How can I help you today? Ask me anything or start a conversation!</p>
    </div>
  </div>

  <div class="input-section">
    <input type="text" id="userInput" placeholder="Message Swemun AI..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const container = document.getElementById("chatContainer");
      const welcome = document.getElementById("welcomeScreen");

      const text = input.value.trim();
      if (text === "") return;

      // প্রথম মেসেজ আসলে ওয়েলকাম স্ক্রিন হাইড হয়ে যাবে
      if (welcome) {
        welcome.style.display = "none";
      }

      // ১. ইউজারের মেসেজ চ্যাটে যোগ করা
      const userMsg = document.createElement("div");
      userMsg.classList.add("message", "user");
      userMsg.textContent = text;
      container.appendChild(userMsg);

      input.value = "";
      container.scrollTop = container.scrollHeight;

      // ২. এআই-এর ফেক রেসপন্স জেনারেট করা (১ সেকেন্ড পর)
      setTimeout(() => {
        const aiMsg = document.createElement("div");
        aiMsg.classList.add("message", "ai");

        // এআই কী উত্তর দিবে তার কিছু স্যাম্পল
        const aiReplies = [
          "মজার একটি প্রশ্ন করেছেন! এ বিষয়ে আরও বিস্তারিত বলুন।",
          "আমি আপনার কথা বুঝতে পেরেছি। বলুন, আর কী সাহায্য করতে পারি?",
          "এটি একটি চমৎকার আইডিয়া! আমি Swemun AI হিসেবে সবসময় আপনার সাথে আছি।",
          "তথ্যটি নোট করে নিলাম। আরও কিছু জানতে চান কি?"
        ];
        const randomReply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
        
        aiMsg.textContent = randomReply;
        container.appendChild(aiMsg);
        container.scrollTop = container.scrollHeight;
      }, 1000);
    }

    // ইন্টার বা কিবোর্ডের এন্টার প্রেস করলে যেন মেসেজ চলে যায়
    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
</html>
